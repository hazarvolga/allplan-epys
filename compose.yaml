services:
  web:
    build:
      context: .
      args:
        ALLOW_AI_CRAWLERS: ${ALLOW_AI_CRAWLERS:-true}
        NEXT_PUBLIC_PUBLISHER: ${NEXT_PUBLIC_PUBLISHER:-Aluplan}
        NEXT_PUBLIC_AFFILIATION: ${NEXT_PUBLIC_AFFILIATION:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_CONTENT_AUTHOR: ${NEXT_PUBLIC_CONTENT_AUTHOR:-}
        NEXT_PUBLIC_CONTENT_REVIEWER: ${NEXT_PUBLIC_CONTENT_REVIEWER:-}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
    env_file: .env
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
